# Nuclear fix - rewrite the image lines directly
export PROJECT_ID=$(gcloud config get-value project)

# Use python to do a clean replace
python3 -c "
import re
with open('cloudbuild-dev.yaml', 'r') as f:
    content = f.read()
content = content.replace('hello-cloudbuild-dev', 'hello-cloudbuild')
with open('cloudbuild-dev.yaml', 'w') as f:
    f.write(content)
print('Done')
"

# Verify no more -dev in image names
grep "hello-cloud" cloudbuild-dev.yaml

git add cloudbuild-dev.yaml
git commit -m "remove dev suffix from image name"
git push origin dev